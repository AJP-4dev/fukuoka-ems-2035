<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>福岡市 救急需要の未来地図 2025→2035｜スライド</title>
<meta name="description" content="福岡市の救急出場件数が2035年までにどう変わるかを、21枚のスライドで10分で説明します。公表資料の再計算であり、市の公式見解ではありません。">
<meta name="theme-color" content="#14213d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#14213d;--red:#e63946;--purple:#8e3b8f;--orange:#f4a259;--blue:#3a7bd5;--sky:#9ad0f5;--green:#1b998b;
  --ink2:#5b6b82;--ink3:#8e9bae;--line:#dfe4ec;--paper:#f4f6f9;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);color:var(--navy);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
#deck{height:100dvh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y proximity;scroll-behavior:smooth;overscroll-behavior:contain}
@media (min-width:900px){#deck{scroll-snap-type:y mandatory}}
.slide{position:relative;min-height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;background:#fff;overflow:hidden}
@media (min-width:900px){.slide{height:100dvh}}
.slide.navy{background:var(--navy);color:#fff}
.in{position:relative;z-index:1;width:100%;max-width:1180px;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);
  padding:calc(clamp(52px,8vh,64px) + var(--sat)) clamp(16px,4vw,48px) calc(clamp(18px,3.5vh,30px) + var(--sab))}
h1,h2{text-wrap:balance;margin:0;font-weight:700;line-height:1.3}
h2{font-size:clamp(24px,3.4vw + 8px,40px);letter-spacing:.01em}
h1{font-size:clamp(34px,6vw + 6px,64px)}
.kick{font-size:clamp(12px,1.4vw,14px);font-weight:700;color:var(--ink2);letter-spacing:.08em}
.navy .kick{color:var(--sky)}
.vis{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
.vis svg{max-width:100%}
.t{margin:0;font-size:clamp(16px,1.3vw + 10px,20px);line-height:1.65}
.t b{font-weight:700}
.t.m{color:var(--ink2);font-size:clamp(14px,1vw + 9px,17px)}
.navy .t.m{color:#b7c3d9}
.src{margin:0;padding-right:52px;font-size:clamp(11px,.5vw + 8px,13px);color:var(--ink3);line-height:1.5;padding-top:8px;border-top:1px solid var(--line)}
.navy .src{color:#8e9bae;border-color:rgba(255,255,255,.18)}
.num{font-family:Manrope,"Zen Kaku Gothic New",sans-serif;font-weight:800;line-height:1;font-size:clamp(48px,7vw + 14px,72px);letter-spacing:-.01em}
.num small{font-size:.32em;font-weight:700;margin-left:.2em;letter-spacing:0}
.num.r{color:var(--red)}.num.p{color:var(--purple)}.num.g{color:var(--green)}
.lab{font-size:clamp(12px,.7vw + 9px,15px);color:var(--ink2);line-height:1.4}
.tag{display:inline-block;font-size:clamp(12px,.8vw + 9px,15px);font-weight:700;color:#fff;background:var(--orange);border-radius:999px;padding:2px 12px;vertical-align:middle;margin-left:8px;letter-spacing:.04em}
.tag.big{font-size:clamp(16px,1.2vw + 10px,22px);padding:4px 16px;margin:0}
/* cards / grids */
.grid{display:grid;gap:clamp(10px,1.6vw,18px)}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:720px){.g3,.g2,.g4{grid-template-columns:1fr}.g2.keep{grid-template-columns:1fr 1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,1.6vw,20px)}
.card h3{margin:0 0 4px;font-size:clamp(16px,1vw + 11px,22px);line-height:1.35}
.card p{margin:0;font-size:clamp(14px,.7vw + 10px,17px);line-height:1.6;color:var(--navy)}
.card .no{display:inline-flex;width:1.7em;height:1.7em;border-radius:50%;background:var(--navy);color:#fff;align-items:center;justify-content:center;font-size:.85em;margin-right:8px;flex:none;font-weight:700}
.card.mini p{font-size:clamp(13px,.5vw + 10px,15px);color:var(--ink2)}
.card.mini h3{font-size:clamp(14px,.6vw + 10px,17px)}
.card .bar{height:4px;border-radius:2px;margin-bottom:8px;background:var(--blue)}
/* flow */
.flow{display:flex;align-items:stretch;gap:0}
.flow .st{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.flow .st.end{background:var(--navy);color:#fff;border-color:var(--navy)}
.flow .st.end .why{color:#b7c3d9}
.flow .st b{font-size:clamp(15px,.6vw + 11px,18px);line-height:1.35}
.flow .why{font-size:clamp(12.5px,.4vw + 10px,14.5px);color:var(--ink2);line-height:1.5}
.flow .no{font-family:Manrope,sans-serif;font-weight:800;color:var(--red);font-size:1.3em;line-height:1}
.flow .ar{flex:none;width:26px;align-self:center;text-align:center;color:var(--ink3);font-size:22px}
.flow .ar:before{content:"\25B6"}
@media (max-width:900px){.flow{flex-direction:column}.flow .ar{width:auto;height:24px;line-height:24px}.flow .ar:before{content:"\25BC"}}
/* table */
table.tb{border-collapse:collapse;width:100%;font-size:clamp(13px,.6vw + 9px,17px)}
.tb th,.tb td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb th{color:var(--ink2);font-weight:500;font-size:.85em}
.tb td small{display:block;color:var(--ink3);font-size:.78em;white-space:nowrap}
.tb td b{font-family:Manrope,"Zen Kaku Gothic New",sans-serif}
.tb tr.sum td{border-top:2px solid var(--navy);font-weight:700}
.tb tr.fin td{background:var(--navy);color:#fff;border:0}.tb tr.fin td small{color:#b7c3d9}
.tb .dot{display:inline-block;width:.7em;height:.7em;border-radius:3px;margin-right:6px}
/* checklist */
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px)}
.chk li{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:clamp(10px,1.4vw,16px);font-size:clamp(15px,.8vw + 10px,19px);line-height:1.55}
.chk .no{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em}
.chk li.est .no{background:var(--orange)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:clamp(12px,.6vw + 9px,15px);color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:4px;width:20px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,28px);align-items:end}
@media (max-width:720px){.pair.stack{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:clamp(10px,3vw,40px);align-items:flex-end}
.kpi{display:flex;flex-direction:column;gap:4px}
.navy .lab{color:#b7c3d9}
.cover-map{position:absolute;right:-4%;bottom:-6%;width:min(70%,820px);opacity:1;pointer-events:none;z-index:0}
.fin3{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px)}
.fin3 .l{display:flex;gap:14px;align-items:flex-start;font-size:clamp(18px,1.4vw + 11px,28px);line-height:1.45;font-weight:700}
.fin3 .l span{flex:none;font-family:Manrope,sans-serif;color:var(--red);font-weight:800}
.next{display:flex;flex-wrap:wrap;gap:8px}
.next span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;font-size:clamp(14px,.6vw + 10px,17px)}
.navy a{color:var(--sky)}
/* chrome */
#bar{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + var(--sat)) clamp(12px,3vw,24px) 0;pointer-events:none}
#bar a,#cnt{pointer-events:auto;background:rgba(255,255,255,.92);color:var(--navy);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;text-decoration:none;box-shadow:0 1px 6px rgba(20,33,61,.18)}
#cnt{font-family:Manrope,sans-serif;letter-spacing:.04em}
#nxt{position:fixed;z-index:20;right:clamp(12px,3vw,24px);bottom:calc(12px + var(--sab));width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(20,33,61,.35);border:1px solid rgba(255,255,255,.35)}
#nxt[hidden]{display:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media print{#deck{height:auto;overflow:visible}.slide{height:auto;min-height:0;page-break-after:always}#bar,#nxt{display:none}}
</style>
</head>
<body>
<div id="bar"><a href="index.html">← レポート</a><span id="cnt">1 / 21</span></div>
<main id="deck" tabindex="0" aria-label="スライド"></main>
<button id="nxt" aria-label="次のスライド">↓</button>
<script>
/*__DATA__*/
</script>
<script>
"use strict";
const fmt=n=>Math.round(n).toLocaleString('ja-JP');
const man=(n,d=1)=>(n/10000).toFixed(d);
const pc=(v,d=1)=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d)+'%';
const NAVY='#14213d',RED='#e63946',PUR='#8e3b8f',ORG='#f4a259',BLU='#3a7bd5',SKY='#9ad0f5',GRN='#1b998b',INK2='#5b6b82',INK3='#8e9bae',LN='#dfe4ec';
const AG=['k','j','w','e1','e2','e3'];
const AGL={k:'0–6歳',j:'7–17歳',w:'18–64歳',e1:'65–74歳',e2:'75–84歳',e3:'85歳以上'};
const AGC={k:SKY,j:'#6aa9e8',w:BLU,e1:ORG,e2:'#d4739c',e3:PUR};
const W=DATA.wards, YR=DATA.years, TR=DATA.trend, SER=DATA.series, R=DATA.rates, DR=DATA.dispRatio, DAYF=DATA.dayf;
const wdisp=(w,y)=>w.disp[y];
const cityL=y=>W.reduce((s,w)=>s+w.disp[y],0);
const mult=(sc,y)=>sc==='M'?Math.pow(1+TR.slopePre,Math.min(y,TR.capYear)-2024):sc==='H'?Math.pow(1+TR.slopeAll,y-2024):1;
const cityS=(y,sc)=>cityL(y)*mult(sc,+y);
const cpop=(y,a)=>W.reduce((s,w)=>s+(a?w.pop[y][a]:AG.reduce((q,g)=>q+w.pop[y][g],0)),0);
const wpop=(w,y)=>AG.reduce((s,a)=>s+w.pop[y][a],0);
const MOBILE=()=>innerWidth<720;
let FS=14;

/* ---------- SVG helpers (座標は実ピクセル。幅=コンテナ幅で描くので文字が縮まない) ---------- */
const svg=(w,h,b,label)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${label||''}" style="display:block">${b}</svg>`;
const tx=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.fs||FS}" fill="${o.c||NAVY}" text-anchor="${o.a||'middle'}" font-weight="${o.w||400}"${o.f?` font-family="${o.f}"`:''}>${s}</text>`;
const NUMF='Manrope,sans-serif';
function vbars(w,h,items,o={}){/* items:[{l,l2,v,c,t}] */
  const top=o.top||26,bot=o.bot||(o.two?42:26),n=items.length,max=o.max||Math.max(...items.map(i=>i.v));
  const gap=o.gap??Math.max(3,w/n*.18), bw=(w-gap*(n+1))/n, ph=h-top-bot; let b='';
  b+=`<line x1="0" x2="${w}" y1="${h-bot}" y2="${h-bot}" stroke="${LN}"/>`;
  items.forEach((it,i)=>{const x=gap+i*(bw+gap),bh=it.v/max*ph,y=h-bot-bh;
    b+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${it.c||RED}"/>`;
    if(it.t!==''&&(it.t||!o.sparse||it.show))b+=tx(x+bw/2,y-6,it.t||fmt(it.v),{fs:o.vfs||FS,w:700,f:NUMF});
    if(!o.sparse||it.show||it.l2)b+=tx(x+bw/2,h-bot+16,it.l,{fs:o.lfs||FS-1,c:INK2});
    if(it.l2)b+=tx(x+bw/2,h-bot+16+FS+2,it.l2,{fs:o.lfs||FS-2,c:INK3});});
  return b;}
function hbars(w,items,o={}){/* items:[{l,v,t,c,sub}] */
  const lw=o.lw||(MOBILE()?58:96),vw=o.vw||(MOBILE()?70:96),rh=o.rh||(MOBILE()?34:38),max=o.max||Math.max(...items.map(i=>i.v)),bw=w-lw-vw;let b='';
  items.forEach((it,i)=>{const y=i*rh,bl=Math.max(2,it.v/max*bw);
    b+=tx(lw-8,y+rh/2+5,it.l,{a:'end',fs:o.lfs||FS+1});
    b+=`<rect x="${lw}" y="${y+5}" width="${bl}" height="${rh-12}" rx="3" fill="${it.c||RED}"/>`;
    b+=tx(lw+bl+7,y+rh/2+5,it.t||fmt(it.v),{a:'start',fs:o.vfs||FS+1,w:700,f:NUMF});});
  if(o.vline!=null){const x=lw+o.vline/max*bw;b+=`<line x1="${x}" x2="${x}" y1="0" y2="${items.length*rh}" stroke="${NAVY}" stroke-dasharray="4 3"/>`+tx(x,items.length*rh+14,o.vlab||'',{fs:FS-1,c:INK2});}
  return {b,h:items.length*rh+(o.vline!=null?20:0)};}
function lineChart(w,h,o){/* o:{x:[a,b],y:[a,b],xt:[],yt:[],yf,series:[{p:[[x,y]],c,dash,sw,dot}],notes:[]} */
  const L=o.L||(MOBILE()?40:52),Rr=o.R||(MOBILE()?58:84),T=16,B=28,pw=w-L-Rr,ph=h-T-B;
  const sx=v=>L+(v-o.x[0])/(o.x[1]-o.x[0])*pw, sy=v=>T+ph-(v-o.y[0])/(o.y[1]-o.y[0])*ph; let b='';
  o.yt.forEach(v=>{b+=`<line x1="${L}" x2="${w-Rr}" y1="${sy(v)}" y2="${sy(v)}" stroke="${LN}"/>`+tx(L-6,sy(v)+4,o.yf?o.yf(v):v,{a:'end',fs:FS-1,c:INK2});});
  o.xt.forEach(v=>{b+=tx(sx(v),h-8,v,{fs:FS-1,c:INK2});});
  o.series.forEach(s=>{const d=s.p.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join('');
    b+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.sw||3}" stroke-linejoin="round" stroke-linecap="round"${s.dash?` stroke-dasharray="${s.dash}"`:''}/>`;
    if(s.dots)s.p.forEach(p=>{b+=`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="3.5" fill="${s.c}"/>`;});});
  (o.notes||[]).forEach(n=>{b+=tx(sx(n.x)+(n.dx||0),sy(n.y)+(n.dy||0),n.t,{a:n.a||'start',c:n.c||NAVY,w:700,fs:n.fs||FS,f:n.f});});
  return {b,sx,sy};}
const colorScale=(t)=>{/* 0..1 -> 薄赤→赤 */const a=[253,224,226],z=[230,57,70];return `rgb(${a.map((v,i)=>Math.round(v+(z[i]-v)*t)).join(',')})`};

/* ---------- 数値（すべて DATA から） ---------- */
const N=(()=>{
  const d13=SER.dispatch[2013],d24=SER.dispatch[2024];
  const L25=cityL('2025'),L35=cityL('2035'),M35=cityS('2035','M'),H35=cityS('2035','H');
  const p25=cpop('2025'),p35=cpop('2035');
  const wardG=W.map(w=>({n:w.name,g:(w.disp['2035']/w.disp['2025']-1)*100,w})).sort((a,b)=>b.g-a.g);
  const sts=DATA.stations.filter(s=>s.units>0&&s.perUnit&&s.perUnit['2035']!=null);
  return {d13,d24,L25,L35,M35,H35,p25,p35,wardG,sts,
    over25:sts.filter(s=>s.perUnit['2025']>3000).length, over35:sts.filter(s=>s.perUnit['2035']>3000).length};
})();

/* ---------- 各スライドのチャート ---------- */
const CH={};
CH.s1=()=>{/* 7区の輪郭（背景） */
  const pts=W.flatMap(w=>w.rings.flat());const k=Math.cos(33.6*Math.PI/180);
  const lo=Math.min(...pts.map(p=>p[0])),hi=Math.max(...pts.map(p=>p[0])),la0=Math.min(...pts.map(p=>p[1])),la1=Math.max(...pts.map(p=>p[1]));
  const W0=1000,sc=W0/((hi-lo)*k),H0=(la1-la0)*sc;
  const d=w=>w.rings.map(r=>'M'+r.map(p=>((p[0]-lo)*k*sc).toFixed(1)+' '+((la1-p[1])*sc).toFixed(1)).join('L')+'Z').join('');
  return `<svg viewBox="0 0 ${W0} ${H0}" class="cover-map" aria-hidden="true">${W.map(w=>`<path d="${d(w)}" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linejoin="round"/>`).join('')}</svg>`;};

CH.s3=(el,w)=>{/* 出場件数の推移 2013-2024 */
  const ys=Object.keys(SER.dispatch).map(Number),h=MOBILE()?230:Math.min(300,innerHeight*.34);
  const items=ys.map(y=>({l:MOBILE()?String(y).slice(2):y,v:SER.dispatch[y],c:y===2024?RED:'#f08c94',show:y===2013||y===2024,t:(y===2013||y===2024)?fmt(SER.dispatch[y]):''}));
  return svg(w,h,vbars(w,h,items,{max:120000,sparse:false,vfs:FS-(MOBILE()?2:0)}),'出場件数の推移');};
CH.s4=(el,w)=>{
  const h=MOBILE()?270:Math.min(330,innerHeight*.4),ys=YR.slice(0,11);
  const pop=ys.map(y=>[y,cpop(String(y))/N.p25*100]),dis=ys.map(y=>[y,cityL(String(y))/N.L25*100]);
  const c=lineChart(w,h,{x:[2025,2035],y:[98,114],xt:[2025,2030,2035],yt:[100,105,110],yf:v=>v,series:[{p:pop,c:NAVY},{p:dis,c:RED}],
    notes:[{x:2035,y:dis[10][1],t:pc(dis[10][1]-100),c:RED,dx:8,dy:5,f:NUMF,fs:FS+3},{x:2035,y:pop[10][1],t:pc(pop[10][1]-100),dx:8,dy:5,f:NUMF,fs:FS+3}]});
  return svg(w,h,c.b,'人口と出場件数の伸び（2025年=100）');};
CH.s5=(el,w)=>{
  const h=MOBILE()?280:Math.min(330,innerHeight*.4),items=AG.map(a=>({l:AGL[a].replace('歳以上','歳+').replace('歳',''),l2:'',v:R[a]*100,c:AGC[a],t:(R[a]*100).toFixed(1)}));
  const lab={k:'0–6',j:'7–17',w:'18–64',e1:'65–74',e2:'75–84',e3:'85'};items.forEach((it,i)=>it.l=lab[AG[i]]+(AG[i]==='e3'?'歳以上':'歳'));
  return svg(w,h,vbars(w,h,items,{max:33,gap:Math.max(2,w*.012),vfs:FS+3}),'年齢帯別の搬送率（100人あたり/年）');};
CH.s6=(el,w)=>{
  const h=MOBILE()?300:Math.min(340,innerHeight*.42),top=22,bot=28,ph=h-top-bot,max=Math.max(N.p25,N.p35);
  const colw=Math.min(w*.22,120),xs=[w*.18,w*.52];let b='';
  [['2025',N.p25],['2035',N.p35]].forEach(([y,tot],ci)=>{let acc=0;const x=xs[ci]-colw/2;
    AG.forEach(a=>{const v=cpop(y,a),bh=v/max*ph,yy=h-bot-acc-bh;acc+=bh;
      b+=`<rect x="${x}" y="${yy}" width="${colw}" height="${bh}" fill="${AGC[a]}" stroke="#fff" stroke-width="1"/>`;
      if(a==='e3')b+=tx(x+colw/2,yy+bh/2+5,man(v)+'万',{c:'#fff',w:700,f:NUMF,fs:FS+2});});
    b+=tx(xs[ci],h-8,y+'年',{w:700,fs:FS+1})+tx(xs[ci],h-bot-acc-6,man(tot)+'万人',{fs:FS-1,c:INK2});});
  /* 凡例（右側） */

function draw(){FS=MOBILE()?13:15;document.querySelectorAll('[data-ch]').forEach(el=>{const f=CH[el.dataset.ch];const w=Math.floor(el.clientWidth);if(w>0)el.innerHTML=f(el,w)});}

if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);

/* ---------- ナビ ---------- */
const slides=[...document.querySelectorAll('.slide')],cnt=document.getElementById('cnt'),nxt=document.getElementById('nxt');
let cur=0;
function upd(){let c=0;slides.forEach((s,i)=>{if(s.getBoundingClientRect().top<=innerHeight*.4)c=i});cur=c;cnt.textContent=(c+1)+' / '+slides.length;nxt.hidden=c===slides.length-1;history.replaceState(null,'','#'+(c+1))}
deck.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});
const go=i=>{i=Math.max(0,Math.min(slides.length-1,i));slides[i].scrollIntoView({behavior:'smooth',block:'start'})};
nxt.addEventListener('click',()=>go(cur+1));
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)&&!e.shiftKey){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)||(e.key===' '&&e.shiftKey)){e.preventDefault();go(cur-1)}
  else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(slides.length-1)}});
const h0=parseInt(location.hash.slice(1));if(h0>1&&h0<=slides.length)slides[h0-1].scrollIntoView({block:'start'});
upd();deck.focus({preventScroll:true});
</script>
